# DK Controller 配置模板
# 用法：复制为 configs/cairnd-config.yaml 并填入真实值。
# secret 字段只存「环境变量名」或「文件路径」，绝不存值本身。

service:
  mode: daemon                 # daemon | once
  poll_interval: 5m
  state_db: /var/lib/cairnd/controller.db
  workspaces_dir: /var/lib/cairnd/workspaces
  cache_dir: /var/lib/cairnd/cache
  bundle_dir: /var/lib/cairnd/bundles
  listen_addr: 127.0.0.1:7810  # 对外暴露时设为 0.0.0.0:7810 并配置 admin_token_env
  admin_token_env: CAIRN_CONTROLLER_ADMIN_TOKEN
  max_concurrent_repos: 2

github:
  app_id: 123456               # GitHub App ID
  private_key_file: /run/secrets/cairn-app.pem   # 与 private_key_env 二选一
  # private_key_env: CAIRN_GITHUB_APP_PRIVATE_KEY  # 二选一
  webhook_secret_env: CAIRN_GITHUB_WEBHOOK_SECRET
  api_base_url: https://api.github.com

llm:
  provider: openai_compatible
  endpoint: https://api.deepseek.com/chat/completions
  api_key_env: CAIRN_LLM_API_KEY
  model: deepseek-v4-pro
  max_tokens: 383000
  timeout: 600s
  max_retries: 3

catalog:
  repo: acme/knowledge-catalog  # Catalog Repo (owner/name)
  branch: main
  manifest_dir: knowledge-bases
  release_tag_template: "kb-{group}-{source_sha}"
  release_prerelease: true

repos:
  - id: payment
    url: https://github.com/acme/payment-skills.git
    owner: acme
    name: payment-skills
    branch: main
    kg_group: payment
    rewrite:
      mode: pr                  # pr | direct
      min_confidence: 0.7
      auto_merge_on_green: false  # 默认 false：不自动合并
