# ════════════════════════════════════════════════════════════════════
# 用法 / Usage
#   本文件位于 deploy/，但构建上下文是【仓库根】（Dockerfile 需要 go.mod）。
#   因此必须从仓库根启动，用 -f 指定本文件：
#
#     cp configs/cairnd.example.yaml configs/cairnd.yaml   # 填入真实值
#     export CAIRN_LLM_API_KEY=...
#     export CAIRN_GITHUB_WEBHOOK_SECRET=...
#     export CAIRN_CONTROLLER_ADMIN_TOKEN=...
#     docker compose -f deploy/docker-compose.yml up -d --build
#
#   GitHub App 私钥放 ./secrets/cairn-app.pem（secrets/ 已被 .gitignore 排除）。
# ════════════════════════════════════════════════════════════════════

services:
  cairnd:
    build:
      # 上下文 = 仓库根（.. 相对本文件所在的 deploy/）
      context: ..
      dockerfile: deploy/Dockerfile
    image: cairnd:latest
    container_name: cairnd
    restart: unless-stopped
    ports:
      - "127.0.0.1:7810:7810"
    volumes:
      - cairnd-data:/var/lib/cairnd
      - ../configs/cairnd.yaml:/etc/cairnd/config.yaml:ro
      # GitHub App private key（Docker secret 或文件挂载）
      - ../secrets/cairn-app.pem:/run/secrets/cairn-app.pem:ro
    environment:
      - CAIRN_LLM_API_KEY=${CAIRN_LLM_API_KEY}
      - CAIRN_GITHUB_WEBHOOK_SECRET=${CAIRN_GITHUB_WEBHOOK_SECRET}
      - CAIRN_CONTROLLER_ADMIN_TOKEN=${CAIRN_CONTROLLER_ADMIN_TOKEN}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7810/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 可选：MCP 消费端（只读挂载 cairnd 产出的 Bundle）
  # cairn-mcp 只认 --config，配置里的 mcp.knowledge_bases[].path 指向 .db。
  cairn-mcp:
    image: cairnd:latest
    container_name: cairn-mcp
    restart: unless-stopped
    entrypoint: ["cairn-mcp"]
    command: ["--config", "/etc/mcp/config.yaml"]
    depends_on:
      cairnd:
        condition: service_healthy
    volumes:
      - cairnd-data:/var/lib/cairnd:ro
      # 复制 configs/mcp-local.example.yaml 为 configs/mcp.yaml，
      # 并把 path 指向 /var/lib/cairnd/bundles/<your-kg>/current/knowledge.db
      - ../configs/mcp.yaml:/etc/mcp/config.yaml:ro

volumes:
  cairnd-data:
